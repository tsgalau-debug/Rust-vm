name: wasm-ci

on:
  push:
    branches: [main]
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  pull_request:
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM modules (Rust -> WASI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo (scoped ke subfolder core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-microvm-tool-main
          shared-key: wasm-ci

      - name: Cargo check
        working-directory: ai-microvm-tool-main
        run: cargo check --workspace --target wasm32-wasip1

      - name: Test shared-types (host target — no KVM needed)
        working-directory: ai-microvm-tool-main
        run: cargo test -p shared-types

      - name: Build release (semua crate bin)
        working-directory: ai-microvm-tool-main
        run: cargo build --release --target wasm32-wasip1 --workspace

      - name: Stage all wasm into wasm/
        working-directory: ai-microvm-tool-main
        run: |
          mkdir -p wasm
          cp target/wasm32-wasip1/release/*.wasm wasm/ 2>/dev/null || true
          ls -lh wasm/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: ai-microvm-tool-main/wasm/*.wasm
          if-no-files-found: error
          retention-days: 14
