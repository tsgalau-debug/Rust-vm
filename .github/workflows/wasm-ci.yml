name: wasm-ci

on:
  push:
    branches: [main]
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  pull_request:
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: OS libs (host) + WASM tool bins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-microvm-tool-main
          shared-key: wasm-ci

      # 1) Semua crate (shared-types + vm-runtime + bins) harus compile di HOST.
      - name: Cargo check (host)
        working-directory: ai-microvm-tool-main
        run: cargo check --workspace

      # 2) Semua logika OS diuji di HOST — tanpa KVM.
      - name: Cargo test (host, all crates)
        working-directory: ai-microvm-tool-main
        run: cargo test --workspace

      # 3) Hanya BINARY tool yang jadi artifact WASM (guest). Lib host tidak ikut.
      - name: Build WASM tool bins
        working-directory: ai-microvm-tool-main
        run: cargo build --release --target wasm32-wasip1 --bins

      - name: Stage wasm into wasm/
        working-directory: ai-microvm-tool-main
        run: |
          mkdir -p wasm
          cp target/wasm32-wasip1/release/*.wasm wasm/ 2>/dev/null || true
          ls -lh wasm/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: ai-microvm-tool-main/wasm/*.wasm
          if-no-files-found: error
          retention-days: 14
