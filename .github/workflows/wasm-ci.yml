name: wasm-ci

on:
  push:
    branches: [main]
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  pull_request:
    paths:
      - 'ai-microvm-tool-main/**'
      - '.github/workflows/wasm-ci.yml'
  workflow_dispatch:   # supaya Anda bisa trigger build manual kapan pun, tanpa ubah kode

permissions:
  contents: read

concurrency:
  group: wasm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build wasm-echo (Rust -> WASI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo (scoped ke subfolder core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-microvm-tool-main
          shared-key: wasm-ci

      - name: Cargo check
        working-directory: ai-microvm-tool-main
        run: cargo check --workspace --target wasm32-wasip1

      - name: Build release
        working-directory: ai-microvm-tool-main
        run: cargo build --release --target wasm32-wasip1 -p wasm-echo

      # Taruh hasil build ke tempat tujuan akhirnya, supaya saat Anda
      # extract artifact di root workspace, file mendarat PERSIS di
      # ai-microvm-tool-main/wasm/wasm-echo.wasm (tidak perlu mv manual).
      - name: Stage artifact into wasm/
        working-directory: ai-microvm-tool-main
        run: |
          mkdir -p wasm
          cp target/wasm32-wasip1/release/wasm-echo.wasm wasm/wasm-echo.wasm
          ls -lh wasm/wasm-echo.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-echo
          path: ai-microvm-tool-main/wasm/wasm-echo.wasm
          if-no-files-found: error
          retention-days: 14
