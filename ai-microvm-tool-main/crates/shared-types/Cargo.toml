[package]
name = "shared-types"
version = "0.1.0"
edition = "2021"

# Fondasi "OS" butuh dua alat standar:
# - serde  : kontrak harus bisa melintasi batas host↔guest (vsock/HTTP) secara deterministik
# - thiserror: taksonomi error yang bisa di-match agent (seperti errno)
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
